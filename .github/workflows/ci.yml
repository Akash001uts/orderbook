name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 04:00 UTC daily. The only job that behaves differently on a schedule is the
    # differential test, which runs its full command budget here.
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_COLOR_DIAGNOSTICS: "ON"

  # Randomised command budget for the differential test against the reference
  # book. Ten million commands per push would add minutes to every single commit
  # for no extra information: the bugs a randomised sequence finds, it finds early,
  # and the long runs exist to explore rarer state rather than to gate a push. So
  # a push gets a million and the nightly schedule gets the full ten million. A
  # manual dispatch also gets the full budget, so the long run is available on
  # demand without waiting for the schedule.
  #
  # Any failing sequence is shrunk to a minimal reproducer and committed to
  # test/regressions/, which is what makes the reduced push budget safe: once a
  # bug has been found at any budget, it is pinned by a deterministic test that
  # runs on every push regardless of this value.
  OB_DIFF_COMMANDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '10000000' || '1000000' }}

jobs:
  # Both compilers, every non sanitizer preset. -Werror is on, so a warning from
  # any target under include/, src/, itch/, strategy/, bench/, test/, or tools/
  # fails the job.
  build:
    name: build ${{ matrix.compiler }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release, relwithdebinfo]
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 clang-18 llvm-18

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc-13"  >> "$GITHUB_ENV"
            echo "CXX=g++-13" >> "$GITHUB_ENV"
          else
            echo "CC=clang-18"   >> "$GITHUB_ENV"
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi

      - name: Report toolchain
        run: |
          "$CXX" --version
          cmake --version
          ninja --version

      # -march=native is off in CI, deliberately.
      #
      # It serves no purpose here: CI verifies correctness, and no benchmark number
      # published anywhere comes from a hosted runner. What it does do is make the
      # build depend on whichever CPU the runner happened to allocate. Clang 18's
      # native detection on a recent Intel part emits an invalid AVX10.1 feature
      # combination warning, which -Werror turns into a build failure that appears
      # and disappears with the hardware rather than with the code.
      #
      # Local release builds keep it, because that is where the measurements are
      # taken. It changes instruction selection, not semantics, so nothing about
      # correctness goes unverified by turning it off.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DOB_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The differential test is excluded here and given its own job. Running it
      # six times per push, once per compiler and preset, would multiply the
      # slowest test in the suite by six for no extra coverage: it is
      # deterministic, so every one of those runs explores the identical sequence.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -E "^Differential"

  # The differential test against the naive reference book, and the strongest
  # correctness evidence in this repository. Debug rather than release, so that
  # the arena's use-after-free checks and the book's invariant assertions are live
  # while it runs.
  differential:
    name: differential
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset debug -DOB_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build --preset debug

      - name: Run
        run: ctest --preset debug -R "^Differential" --output-on-failure

      # A mismatch shrinks itself to a minimal reproducer on disk. Uploading it
      # means the failing sequence survives the runner, which is the difference
      # between a reproducible bug and a note that something went wrong once.
      - name: Upload any shrunk reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-reproducer
          path: test/regressions/
          if-no-files-found: ignore

  # Coverage guided differential fuzzing. A short run on every push, a long one on
  # the nightly schedule, because the value of a fuzzer is roughly logarithmic in
  # how long it runs and a push should not wait for it.
  #
  # This job cannot be run on the development host at all: -fsanitize=fuzzer is
  # unsupported for the x86_64-w64-windows-gnu target, so CI is the only place the
  # target is ever built.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 llvm-18

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B out/build/fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOB_BUILD_FUZZERS=ON \
            -DOB_BUILD_TESTS=OFF \
            -DOB_BUILD_BENCH=OFF \
            -DOB_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build out/build/fuzz

      - name: Run
        env:
          FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '900' || '90' }}
        run: |
          mkdir -p out/fuzz-corpus
          ./out/build/fuzz/ob_fuzz_differential out/fuzz-corpus \
            -max_total_time="$FUZZ_SECONDS" \
            -max_len=4096 \
            -print_final_stats=1

      - name: Upload any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  # Sanitizers run on clang, which has the most complete runtime coverage of the
  # three. tsan guards the harness and strategy driver: the engine itself is
  # single threaded by design, so a tsan report there means a harness bug.
  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 llvm-18

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # A reduced differential budget under the sanitizers, which run the workload
      # several times slower. The point of running it here at all is not volume,
      # it is that the sanitizers see memory errors the state comparison cannot:
      # a stale arena index that happens to still hold plausible values compares
      # equal and is caught only by asan.
      - name: Test
        env:
          OB_DIFF_COMMANDS: 100000
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files '*.hpp' '*.cpp')
          printf 'checking %d files\n' "${#files[@]}"
          clang-format-18 --dry-run --Werror --style=file "${files[@]}"

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-tidy-18

      # Fuzzers are enabled here even though this job never runs them, so that the
      # fuzz translation unit has an entry in compile_commands.json. Without one,
      # clang-tidy analyses it with default flags rather than the flags it is
      # actually built with, which is the same mistake as pointing clang-tidy at a
      # header and produces results that mean nothing.
      - name: Configure for compile_commands.json
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset debug -DOB_BUILD_FUZZERS=ON -DOB_NATIVE_ARCH=OFF

      # clang-tidy is pointed at translation units only, never at headers
      # directly. A header has no entry in compile_commands.json, so running it
      # standalone loses -std=c++20 and the include paths, which produces a wall
      # of bogus parse errors. Header diagnostics arrive through HeaderFilterRegex
      # in .clang-tidy instead, reported against the units that include them.
      - name: Run clang-tidy
        run: |
          mapfile -t units < <(git ls-files '*.cpp')
          printf 'checking %d translation units\n' "${#units[@]}"
          clang-tidy-18 -p out/build/debug --warnings-as-errors='*' "${units[@]}"

  # Style rule I set for myself: no em dashes anywhere in the repository, and
  # no TODO or FIXME markers surviving a phase exit.
  style:
    name: style markers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Reject em dashes
        run: |
          if git grep -n -P '\x{2014}' -- . ':!.github/workflows/ci.yml'; then
            echo "em dash found, replace with a comma, colon, or full stop"
            exit 1
          fi

      - name: Reject leftover markers
        run: |
          if git grep -nE '\b(TODO|FIXME|XXX|HACK)\b' -- . ':!.github/workflows/ci.yml'; then
            echo "unresolved marker found"
            exit 1
          fi

  # The results site reads committed JSON artifacts. This job proves they cannot
  # drift from the code that produced them: it rebuilds the tools, regenerates the
  # artifact set from the one raw capture the repository commits, and diffs the
  # bytes. A change to a tool that alters a published number therefore fails the
  # build rather than silently changing the site. Same philosophy as the regression
  # fixtures in test/.
  #
  # This covers QQQ on data/qqq_slice.itch. Every other symbol on the site is
  # derived from a 7.68 GB full day capture that no runner can fetch, which is why
  # those artifacts carry provenance instead of a guard. The index is still checked,
  # because it is a pure function of files already committed. See
  # site/data/SCHEMA.md.
  artifacts:
    name: site artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset release -DOB_NATIVE_ARCH=OFF

      - name: Build the tools
        run: cmake --build --preset release --target itch_replay ob_strategy_backtest

      # The generator resolves the binary directory itself and tolerates the .exe
      # suffix the development host produces, so the same script runs in both
      # places and there is only one command line to keep correct.
      - name: Regenerate the guarded artifacts
        env:
          OB_BIN: out/build/release
        run: scripts/generate_ci_artifacts.sh site/data/ci

      - name: Diff against the committed artifacts
        run: |
          if ! git diff --exit-code -- site/data/ci; then
            echo
            echo "The regenerated artifacts differ from the committed ones."
            echo "If this change to a tool was intended, rerun"
            echo "  scripts/generate_ci_artifacts.sh"
            echo "and commit the result with the change that caused it."
            exit 1
          fi

      # The index cannot be regenerated from raw data here, but it is a pure
      # function of the per symbol artifacts that are committed, so it can be
      # rebuilt and compared. That closes the gap the provenance rule leaves.
      - name: Check the index against the artifacts it is derived from
        run: python3 scripts/build_index.py --check

  # The results site itself: the benchmark document stays in step with the canonical
  # baseline artifact, the site type checks, and a production build succeeds with the
  # artifacts the page reads copied into the output. This is the guard that a site or
  # artifact change cannot ship a page that fails to build or drops a required file.
  site:
    name: site build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The validator guards against a baseline that parses but misleads: a row
      # marked faster whose flat book is not actually faster, a negative allocation
      # count, a missing noise floor. python3 is present on the runner image already.
      - name: Check the baseline validator
        run: python3 scripts/test_sync_benchmarks.py

      # BENCHMARKS.md renders its baseline and allocation tables from
      # site/data/bench/baseline.json through scripts/sync_benchmarks.py. This fails
      # the build if the document was edited by hand or the artifact changed without
      # rerunning the script.
      - name: Check the benchmark document against the baseline artifact
        run: python3 scripts/sync_benchmarks.py --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # The baseline validator has a mirror of the Python regression cases. Node 22
      # strips the TypeScript types at run time, so no test runner is installed.
      - name: Run the site validator tests
        working-directory: site
        run: npm test

      - name: Build the site
        working-directory: site
        run: npm run build

      # Vite copies site/data verbatim into dist. If a required artifact ever stops
      # being copied, the deployed page would 404 on it silently, so the presence of
      # the files the page actually fetches is asserted here rather than assumed.
      - name: Verify the required files are in the build output
        working-directory: site
        run: |
          required=(
            dist/index.html
            dist/index.json
            dist/bench/baseline.json
            dist/bench/latency.json
            dist/symbols/QQQ/replay.json
          )
          missing=0
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "missing from the build output: $file"
              missing=1
            fi
          done
          exit "$missing"
